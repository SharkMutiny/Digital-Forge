<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="pong-game.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <link rel="icon" type="image/png" href="ping-pong.png" />
    <title>Pong</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Pong</h1>
        <p class="sub">First to 7 wins. The ball speeds up every hit.</p>
      </header>

      <div class="screen">
        <canvas id="court" tabindex="0" aria-label="Pong court. Use W and S or the arrow keys to move your paddle."></canvas>
      </div>

      <div class="controls">
        <div class="group" role="group" aria-label="Players">
          <span>Mode</span>
          <div class="seg">
            <button type="button" id="m-cpu" aria-pressed="true">1 Player</button>
            <button type="button" id="m-two" aria-pressed="false">2 Players</button>
          </div>
        </div>
        <div class="group" role="group" aria-label="Computer difficulty" id="diff-group">
          <span>CPU</span>
          <div class="seg">
            <button type="button" data-diff="easy" aria-pressed="false">Easy</button>
            <button type="button" data-diff="normal" aria-pressed="true">Normal</button>
            <button type="button" data-diff="hard" aria-pressed="false">Hard</button>
          </div>
        </div>
        <div class="group">
          <button type="button" class="btn primary" id="start">Start</button>
          <button type="button" class="btn" id="pause">Pause</button>
          <button type="button" class="btn" id="mute" aria-pressed="false">Sound on</button>
        </div>
      </div>

      <ul class="keys">
        <li><kbd>W</kbd><kbd>S</kbd> left paddle (in 1 Player, <kbd>↑</kbd><kbd>↓</kbd> work too)</li>
        <li><kbd>↑</kbd><kbd>↓</kbd> right paddle in 2 Players</li>
        <li><kbd>Space</kbd> start or pause</li>
        <li>On touch screens, drag on the court. In 2 Players each half moves its own paddle.</li>
      </ul>
    </div>

    <script src="pongGame.js"></script>
  </body>
</html>
